version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidhiai-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/vidhiai.db:/app/backend/vidhiai.db
      - ./corpus:/app/corpus:ro

  frontend:
    image: node:20-alpine
    container_name: vidhiai-frontend
    working_dir: /app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm ci && npm run build && npm run start"
    depends_on:
      - backend
